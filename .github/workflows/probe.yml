name: Probe 26.2 API
on:
  workflow_dispatch:
  push:
    branches: [ "26.2" ]
    paths: [ ".github/workflows/probe.yml" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --no-daemon --stacktrace
      - name: Resolve class simple-names to 26.2 packages
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          echo "PATCHED=$J"
          # build index of all class files once
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/index.txt
          echo "index size: $(wc -l < /tmp/index.txt)"
          echo "===== MAPPING START ====="
          while read C; do
            [ -z "$C" ] && continue
            HITS=$(grep -E "(^|/)${C}\.class$" /tmp/index.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | tr '\n' '|')
            if [ -z "$HITS" ]; then HITS="__NOT_FOUND__"; fi
            echo "${C} => ${HITS}"
          done < probe_classes.txt
          echo "===== MAPPING END ====="
      - name: Fuzzy-find renames for high-freq removed classes
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/idx.txt
          for base in GuiGraphic InteractionResult ItemInteraction UseAnim BakedModel Tier Tesselator ShaderInstance VertexBuffer LightTexture ModelData BlockRenderDispatcher ItemRenderer ItemProperties ItemOverrides MobSpawn RemovalReason ExistingFileHelper WeightedRandom WeightedEntry TooltipContext LootContextParam SimpleCraftingRecipeSerializer; do
            echo "### $base ###"
            grep -iE "/${base}[A-Za-z0-9_]*\.class$" /tmp/idx.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | head -6
          done
      - name: Signature dump for tool/armor/recipe/nbt batches
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/idx.txt
          # 1) Locate simple names -> FQN
          echo "===== LOCATE ====="
          for base in ToolMaterial ToolMaterials ArmorType EquipmentType EquipmentSlotGroup ArmorItem ItemUseAnimation UseAnim ValueInput ValueOutput ARGB FastColor EntitySpawnReason MobSpawnType SwordItem PickaxeItem AxeItem ShovelItem HoeItem DiggerItem MaceItem BlockItem ClientItem ItemModelResolver; do
            echo "### $base ###"
            grep -iE "(^|/)${base}\.class$" /tmp/idx.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | head -6
          done
          # 2) javap dumps (try likely FQNs; javap prints error if wrong, harmless)
          echo "===== JAVAP ====="
          for C in \
            net.minecraft.world.item.equipment.ArmorMaterial \
            net.minecraft.world.item.equipment.ArmorMaterials \
            net.minecraft.world.item.ToolMaterial \
            net.minecraft.world.item.equipment.ToolMaterial \
            net.minecraft.world.item.Item \
            'net.minecraft.world.item.Item$Properties' \
            net.minecraft.world.item.SwordItem \
            net.minecraft.world.item.PickaxeItem \
            net.minecraft.world.item.DiggerItem \
            net.minecraft.world.item.crafting.RecipeSerializer \
            net.minecraft.world.item.crafting.Recipe \
            net.minecraft.world.level.storage.ValueInput \
            net.minecraft.world.level.storage.ValueOutput \
            net.minecraft.world.entity.Entity \
            net.minecraft.util.ARGB ; do
            echo "################ $C ################"
            javap -p -cp "$J" "$C" 2>&1 | grep -iE "public|protected|static final|class |interface |enum |record " | head -50
          done
          # 3) Entity save/load signatures (ValueInput/Output refactor)
          echo "===== ENTITY SAVE/LOAD ====="
          javap -p -cp "$J" net.minecraft.world.entity.Entity 2>&1 | grep -iE "addAdditionalSaveData|readAdditionalSaveData|SaveData|load|save" | head -20
          echo "===== BlockEntity save/load ====="
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "loadAdditional|saveAdditional|load|save" | head -20
          echo "===== ENUM VALUES & METHOD NAMES ====="
          for C in \
            net.minecraft.world.item.ItemUseAnimation \
            net.minecraft.world.item.equipment.ArmorType \
            net.minecraft.world.entity.EntitySpawnReason \
            net.minecraft.util.ARGB \
            net.minecraft.world.entity.EquipmentSlot ; do
            echo "################ $C ################"
            javap -p -cp "$J" "$C" 2>&1 | grep -iE "public static final|public static |enum |class |interface " | head -40
          done
          echo "===== EntityType.Builder / SpawnPlacements create ====="
          javap -p -cp "$J" 'net.minecraft.world.entity.EntityType$Builder' 2>&1 | grep -iE "public|create|build|of" | head -30
          echo "===== ItemParticleOption ctor ====="
          javap -p -cp "$J" net.minecraft.core.particles.ItemParticleOption 2>&1 | grep -iE "public" | head -10
          echo "===== Level spawnAtLocation (on Entity) ====="
          javap -p -cp "$J" net.minecraft.world.entity.Entity 2>&1 | grep -iE "spawnAtLocation" | head
          echo "===== NBT-batch: ItemStack codecs / UUIDUtil / ValueOut list / BlockEntity save sig ====="
          echo "#### ItemStack static codec fields ####"
          javap -p -cp "$J" net.minecraft.world.item.ItemStack 2>&1 | grep -iE "public static final .*Codec|CODEC" | head
          echo "#### UUIDUtil codecs ####"
          javap -p -cp "$J" net.minecraft.core.UUIDUtil 2>&1 | grep -iE "public static final|CODEC" | head
          echo "#### ValueOutput.list / TypedOutputList ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueOutput 2>&1 | grep -iE "list|store|child|putIntArray" | head -20
          javap -p -cp "$J" 'net.minecraft.world.level.storage.ValueOutput$TypedOutputList' 2>&1 | grep -iE "public|add" | head
          echo "#### ValueInput.list / listOrEmpty / TypedInputList (iterable?) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInput 2>&1 | grep -iE "list|read|child" | head -20
          javap -p -cp "$J" 'net.minecraft.world.level.storage.ValueInput$TypedInputList' 2>&1 | grep -iE "public|iterator|stream|forEach" | head
          echo "#### BlockEntity full saveAdditional/loadAdditional signatures ####"
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "Additional|getUpdateTag|handleUpdateTag" | head
          echo "#### storeNullable / store variants on ValueOutput ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueOutput 2>&1 | grep -iE "storeNullable|putBoolean|putUUID|discard" | head
          echo "===== BE-bridge: CompoundTag<->ValueInput/Output adapters ====="
          echo "#### locate TagValueOutput/TagValueInput ####"
          grep -iE "/(TagValueOutput|TagValueInput)\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          echo "#### TagValueOutput API ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.TagValueOutput 2>&1 | grep -iE "public static|public net|createWithContext|createWithoutContext|buildResult|CompoundTag" | head -15
          echo "#### TagValueInput API (full) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.TagValueInput 2>&1 | grep -iE "public|static" | head -20
          echo "#### ValueInputContextHelper ctor ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInputContextHelper 2>&1 | grep -iE "public" | head
          echo "#### NeoForge ValueOutputExtension (CompoundTag interop?) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueOutputExtension 2>&1 | grep -iE "public|CompoundTag|Tag" | head -20
          echo "#### NeoForge ValueInputExtension (all) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueInputExtension 2>&1 | head -25
          echo "#### ValueInput ALL methods (find CompoundTag return) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInput 2>&1 | head -45
          echo "#### ValueOutputExtension (all) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueOutputExtension 2>&1 | head -25
          echo "@@@@ ValueOutputExtension UNFILTERED @@@@"
          javap -public -cp "$J" net.neoforged.neoforge.common.extensions.ValueOutputExtension 2>&1
          echo "@@@@ ValueInputExtension UNFILTERED @@@@"
          javap -public -cp "$J" net.neoforged.neoforge.common.extensions.ValueInputExtension 2>&1
          echo "@@@@ END EXT @@@@"
          echo "@@@@ SimpleCraftingRecipeSerializer locate + special recipe API @@@@"
          grep -iE "/SimpleCraftingRecipeSerializer\.class$|/CustomRecipe\.class$|/SpecialRecipeSerializer\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          echo "#### CustomRecipe (special recipe base) methods ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.CustomRecipe 2>&1 | grep -iE "Serializer|Factory|CustomRecipe\(" | head
          echo "@@@@ END SPECIAL @@@@"
          echo "@@@@ TOOL/ARMOR batch @@@@"
          echo "#### AxeItem ctor ####"
          javap -public -cp "$J" net.minecraft.world.item.AxeItem 2>&1 | grep -iE "AxeItem\(" | head
          echo "#### ArmorType methods (getSlot/getName/getSerializedName) ####"
          javap -public -cp "$J" net.minecraft.world.item.equipment.ArmorType 2>&1 | grep -iE "getSlot|getName|getSerializedName|EquipmentSlot|public " | head -20
          echo "#### EquipmentSlot.Type enum (HUMANOID_ARMOR?) ####"
          javap -public -cp "$J" 'net.minecraft.world.entity.EquipmentSlot$Type' 2>&1 | head -12
          echo "#### humanoidArmor props ####"
          javap -public -cp "$J" 'net.minecraft.world.item.Item$Properties' 2>&1 | grep -iE "humanoidArmor" | head
          echo "#### ItemTags REPAIRS_* constants ####"
          javap -public -cp "$J" net.minecraft.tags.ItemTags 2>&1 | grep -iE "REPAIR|TagKey" | head -20
          echo "#### EquipmentAssets / EquipmentAsset locate ####"
          grep -iE "/(EquipmentAsset|EquipmentAssets)\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          echo "#### EquipmentAssets vanilla keys ####"
          javap -public -cp "$J" net.minecraft.world.item.equipment.EquipmentAssets 2>&1 | grep -iE "ResourceKey|createId|public static" | head -20
          echo "#### CustomDamageItem/Item durability hook: setDamageValue/hurtAndBreak ####"
          javap -public -cp "$J" net.minecraft.world.item.ItemStack 2>&1 | grep -iE "hurtAndBreak|setDamageValue|getDamageValue|isDamaged" | head
          echo "@@@@ END TOOLARMOR @@@@"
          echo "#### BlockEntity getUpdateTag / handleUpdateTag ####"
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "getUpdateTag|handleUpdateTag|ValueInput|ValueOutput" | head
          echo "#### ProblemReporter (for TagValueOutput ctx) ####"
          javap -p -cp "$J" net.minecraft.util.ProblemReporter 2>&1 | grep -iE "public static|DISCARDING|ScopedCollector|interface" | head
          echo "@@@@ RECIPE REDESIGN (1.21.4 recipe-book/display) @@@@"
          echo "#### Recipe interface FULL ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.Recipe 2>&1
          echo "#### RecipeBookCategory / locate ####"
          grep -iE "/(RecipeBookCategory|RecipeBookCategories)\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          javap -public -cp "$J" net.minecraft.world.item.crafting.RecipeBookCategory 2>&1 | head -20
          echo "#### PlacementInfo ####"
          grep -iE "/PlacementInfo\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          javap -public -cp "$J" net.minecraft.world.item.crafting.PlacementInfo 2>&1 | grep -iE "public static|create|NOT_PLACEABLE|Ingredient" | head -20
          echo "#### RecipeDisplay / SlotDisplay locate ####"
          grep -iE "/(RecipeDisplay|SlotDisplay)\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          echo "#### CraftingRecipe interface (reference override set) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.CraftingRecipe 2>&1
          echo "#### RecipeInput ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.RecipeInput 2>&1 | head -15
          echo "#### CustomRecipe (base for special recipes) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.CustomRecipe 2>&1
          echo "#### ShapedRecipe (result accessor? assemble? category?) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.ShapedRecipe 2>&1
          echo "#### ShapelessRecipe ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.ShapelessRecipe 2>&1
          echo "#### RecipeBookCategories constants ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.RecipeBookCategories 2>&1 | grep -iE "public static final" | head -30
          echo "#### Recipe.CommonInfo ####"
          javap -public -cp "$J" 'net.minecraft.world.item.crafting.Recipe$CommonInfo' 2>&1
          echo "#### CraftingRecipe.CraftingBookInfo ####"
          javap -public -cp "$J" 'net.minecraft.world.item.crafting.CraftingRecipe$CraftingBookInfo' 2>&1
          echo "#### ItemStackTemplate ####"
          javap -public -cp "$J" net.minecraft.world.item.ItemStackTemplate 2>&1
          echo "#### NormalCraftingRecipe (super of Shaped/Shapeless) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.NormalCraftingRecipe 2>&1
          echo "#### ShapedRecipePattern ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.ShapedRecipePattern 2>&1 | grep -iE "public|ingredients|width|height" | head -20
          echo "#### ShapedRecipe PRIVATE fields (result type/pattern) ####"
          javap -p -cp "$J" net.minecraft.world.item.crafting.ShapedRecipe 2>&1 | grep -iE "private|result|pattern|ingredient" | head
          echo "#### ShapelessRecipe PRIVATE fields (result/ingredients) ####"
          javap -p -cp "$J" net.minecraft.world.item.crafting.ShapelessRecipe 2>&1 | grep -iE "private|result|ingredient" | head
          echo "#### Registry accessors (get/getOptional/getValue/getOrThrow) ####"
          javap -public -cp "$J" net.minecraft.core.Registry 2>&1 | grep -iE "getOptional|getValue|getValueOrThrow| get\(| getOrThrow| wrapAsHolder|Optional" | head -30
          echo "#### Equippable component + slot (armor detection) ####"
          grep -iE "/Equippable\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          javap -public -cp "$J" net.minecraft.world.item.equipment.Equippable 2>&1 | grep -iE "public|slot" | head -15
          echo "#### DataComponents EQUIPPABLE ####"
          javap -public -cp "$J" net.minecraft.core.component.DataComponents 2>&1 | grep -iE "EQUIPPABLE" | head
          echo "#### EquipmentSlot isArmor/getType ####"
          javap -public -cp "$J" net.minecraft.world.entity.EquipmentSlot 2>&1 | grep -iE "isArmor|getType|public " | head -20
          echo "#### CustomRecipe -p (ctor + category storage) ####"
          javap -p -cp "$J" net.minecraft.world.item.crafting.CustomRecipe 2>&1 | head -20
          echo "#### Vanilla ArmorDyeRecipe (CustomRecipe subclass pattern) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.ArmorDyeRecipe 2>&1 | head -20
          echo "#### ShapedRecipePattern.ingredients() return type ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.ShapedRecipePattern 2>&1 | grep -iE "ingredients|width|height|Data" | head
          echo "#### ResolvableProfile (ctor/factory) ####"
          javap -public -cp "$J" net.minecraft.world.item.component.ResolvableProfile 2>&1 | head -20
          echo "#### Ingredient (EMPTY/CODEC_NONEMPTY/getItems/test/of) ####"
          javap -public -cp "$J" net.minecraft.world.item.crafting.Ingredient 2>&1 | grep -iE "EMPTY|CODEC|getItems|items\(|test|public static|of\(" | head -30
          echo "#### ItemStack SIMPLE_ITEM_CODEC/LIST_STREAM_CODEC ####"
          javap -public -cp "$J" net.minecraft.world.item.ItemStack 2>&1 | grep -iE "SIMPLE_ITEM_CODEC|LIST_STREAM_CODEC|CODEC|STREAM_CODEC" | head
          echo "@@@@ END RECIPE @@@@"
