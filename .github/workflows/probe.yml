name: Probe 26.2 API
on:
  workflow_dispatch:
  push:
    branches: [ "26.2" ]
    paths: [ ".github/workflows/probe.yml" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --no-daemon --stacktrace
      - name: Resolve class simple-names to 26.2 packages
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          echo "PATCHED=$J"
          # build index of all class files once
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/index.txt
          echo "index size: $(wc -l < /tmp/index.txt)"
          echo "===== MAPPING START ====="
          while read C; do
            [ -z "$C" ] && continue
            HITS=$(grep -E "(^|/)${C}\.class$" /tmp/index.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | tr '\n' '|')
            if [ -z "$HITS" ]; then HITS="__NOT_FOUND__"; fi
            echo "${C} => ${HITS}"
          done < probe_classes.txt
          echo "===== MAPPING END ====="
      - name: Fuzzy-find renames for high-freq removed classes
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/idx.txt
          for base in GuiGraphic InteractionResult ItemInteraction UseAnim BakedModel Tier Tesselator ShaderInstance VertexBuffer LightTexture ModelData BlockRenderDispatcher ItemRenderer ItemProperties ItemOverrides MobSpawn RemovalReason ExistingFileHelper WeightedRandom WeightedEntry TooltipContext LootContextParam SimpleCraftingRecipeSerializer; do
            echo "### $base ###"
            grep -iE "/${base}[A-Za-z0-9_]*\.class$" /tmp/idx.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | head -6
          done
      - name: Signature dump for tool/armor/recipe/nbt batches
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/idx.txt
          # 1) Locate simple names -> FQN
          echo "===== LOCATE ====="
          for base in ToolMaterial ToolMaterials ArmorType EquipmentType EquipmentSlotGroup ArmorItem ItemUseAnimation UseAnim ValueInput ValueOutput ARGB FastColor EntitySpawnReason MobSpawnType SwordItem PickaxeItem AxeItem ShovelItem HoeItem DiggerItem MaceItem BlockItem ClientItem ItemModelResolver; do
            echo "### $base ###"
            grep -iE "(^|/)${base}\.class$" /tmp/idx.txt | grep -iE 'net/minecraft|net/neoforged|com/mojang' | sed 's#\.class$##; s#/#.#g' | sort -u | head -6
          done
          # 2) javap dumps (try likely FQNs; javap prints error if wrong, harmless)
          echo "===== JAVAP ====="
          for C in \
            net.minecraft.world.item.equipment.ArmorMaterial \
            net.minecraft.world.item.equipment.ArmorMaterials \
            net.minecraft.world.item.ToolMaterial \
            net.minecraft.world.item.equipment.ToolMaterial \
            net.minecraft.world.item.Item \
            'net.minecraft.world.item.Item$Properties' \
            net.minecraft.world.item.SwordItem \
            net.minecraft.world.item.PickaxeItem \
            net.minecraft.world.item.DiggerItem \
            net.minecraft.world.item.crafting.RecipeSerializer \
            net.minecraft.world.item.crafting.Recipe \
            net.minecraft.world.level.storage.ValueInput \
            net.minecraft.world.level.storage.ValueOutput \
            net.minecraft.world.entity.Entity \
            net.minecraft.util.ARGB ; do
            echo "################ $C ################"
            javap -p -cp "$J" "$C" 2>&1 | grep -iE "public|protected|static final|class |interface |enum |record " | head -50
          done
          # 3) Entity save/load signatures (ValueInput/Output refactor)
          echo "===== ENTITY SAVE/LOAD ====="
          javap -p -cp "$J" net.minecraft.world.entity.Entity 2>&1 | grep -iE "addAdditionalSaveData|readAdditionalSaveData|SaveData|load|save" | head -20
          echo "===== BlockEntity save/load ====="
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "loadAdditional|saveAdditional|load|save" | head -20
          echo "===== ENUM VALUES & METHOD NAMES ====="
          for C in \
            net.minecraft.world.item.ItemUseAnimation \
            net.minecraft.world.item.equipment.ArmorType \
            net.minecraft.world.entity.EntitySpawnReason \
            net.minecraft.util.ARGB \
            net.minecraft.world.entity.EquipmentSlot ; do
            echo "################ $C ################"
            javap -p -cp "$J" "$C" 2>&1 | grep -iE "public static final|public static |enum |class |interface " | head -40
          done
          echo "===== EntityType.Builder / SpawnPlacements create ====="
          javap -p -cp "$J" 'net.minecraft.world.entity.EntityType$Builder' 2>&1 | grep -iE "public|create|build|of" | head -30
          echo "===== ItemParticleOption ctor ====="
          javap -p -cp "$J" net.minecraft.core.particles.ItemParticleOption 2>&1 | grep -iE "public" | head -10
          echo "===== Level spawnAtLocation (on Entity) ====="
          javap -p -cp "$J" net.minecraft.world.entity.Entity 2>&1 | grep -iE "spawnAtLocation" | head
          echo "===== NBT-batch: ItemStack codecs / UUIDUtil / ValueOut list / BlockEntity save sig ====="
          echo "#### ItemStack static codec fields ####"
          javap -p -cp "$J" net.minecraft.world.item.ItemStack 2>&1 | grep -iE "public static final .*Codec|CODEC" | head
          echo "#### UUIDUtil codecs ####"
          javap -p -cp "$J" net.minecraft.core.UUIDUtil 2>&1 | grep -iE "public static final|CODEC" | head
          echo "#### ValueOutput.list / TypedOutputList ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueOutput 2>&1 | grep -iE "list|store|child|putIntArray" | head -20
          javap -p -cp "$J" 'net.minecraft.world.level.storage.ValueOutput$TypedOutputList' 2>&1 | grep -iE "public|add" | head
          echo "#### ValueInput.list / listOrEmpty / TypedInputList (iterable?) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInput 2>&1 | grep -iE "list|read|child" | head -20
          javap -p -cp "$J" 'net.minecraft.world.level.storage.ValueInput$TypedInputList' 2>&1 | grep -iE "public|iterator|stream|forEach" | head
          echo "#### BlockEntity full saveAdditional/loadAdditional signatures ####"
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "Additional|getUpdateTag|handleUpdateTag" | head
          echo "#### storeNullable / store variants on ValueOutput ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueOutput 2>&1 | grep -iE "storeNullable|putBoolean|putUUID|discard" | head
          echo "===== BE-bridge: CompoundTag<->ValueInput/Output adapters ====="
          echo "#### locate TagValueOutput/TagValueInput ####"
          grep -iE "/(TagValueOutput|TagValueInput)\.class$" /tmp/idx.txt | grep -iE 'net/minecraft' | sed 's#\.class$##; s#/#.#g' | sort -u | head
          echo "#### TagValueOutput API ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.TagValueOutput 2>&1 | grep -iE "public static|public net|createWithContext|createWithoutContext|buildResult|CompoundTag" | head -15
          echo "#### TagValueInput API (full) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.TagValueInput 2>&1 | grep -iE "public|static" | head -20
          echo "#### ValueInputContextHelper ctor ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInputContextHelper 2>&1 | grep -iE "public" | head
          echo "#### NeoForge ValueOutputExtension (CompoundTag interop?) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueOutputExtension 2>&1 | grep -iE "public|CompoundTag|Tag" | head -20
          echo "#### NeoForge ValueInputExtension (all) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueInputExtension 2>&1 | head -25
          echo "#### ValueInput ALL methods (find CompoundTag return) ####"
          javap -p -cp "$J" net.minecraft.world.level.storage.ValueInput 2>&1 | head -45
          echo "#### ValueOutputExtension (all) ####"
          javap -p -cp "$J" net.neoforged.neoforge.common.extensions.ValueOutputExtension 2>&1 | head -25
          echo "#### BlockEntity getUpdateTag / handleUpdateTag ####"
          javap -p -cp "$J" net.minecraft.world.level.block.entity.BlockEntity 2>&1 | grep -iE "getUpdateTag|handleUpdateTag|ValueInput|ValueOutput" | head
          echo "#### ProblemReporter (for TagValueOutput ctx) ####"
          javap -p -cp "$J" net.minecraft.util.ProblemReporter 2>&1 | grep -iE "public static|DISCARDING|ScopedCollector|interface" | head
