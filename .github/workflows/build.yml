name: Build Botania 26.2

on:
  push:
    branches: [ 26.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew compileJava --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Show errors
        if: always()
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -E "error:|cannot find symbol|incompatible types|method does not override|package .* does not exist" build.log | head -200 || echo "No standard errors found"
          echo ""
          echo "=== BUILD RESULT ==="
          tail -30 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
